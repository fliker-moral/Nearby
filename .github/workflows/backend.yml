name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: nearby
          POSTGRES_USER: nearby
          POSTGRES_PASSWORD: nearby_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nearby -d nearby"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      AUTH_MODE: dev
      APP_DEBUG: false
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: nearby
      POSTGRES_USER: nearby
      POSTGRES_PASSWORD: nearby_password

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check
